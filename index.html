<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NimbusOps Control Tower</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            margin: 0;
            padding: 0;
        }

        .dashboard {
            max-width: 900px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 0 12px rgba(0,0,0,0.1);
            text-align: center;
        }

        .profile-photo {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #0078ff;
        }

        .qr-code {
            margin-top: 15px;
            width: 180px;
            height: 180px;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            margin: 12px 0;
            background: #0078ff;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
        }

        .btn:hover {
            background: #005fcc;
        }

        .output-box {
            margin-top: 25px;
            padding: 20px;
            background: #222;
            color: #0f0;
            font-family: monospace;
            border-radius: 8px;
            text-align: left;
            white-space: pre-wrap;
        }
    </style>
</head>

<body>

    <div class="dashboard">
        <h1>NimbusOps Control Tower</h1>

        <!-- Profile Photo -->
        <img src="webMePhoto.png" class="profile-photo" alt="Profile Photo" />

        <!-- QR Code under the photo -->
        <img 
            src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=https://nimbusops-control-2.onrender.com" 
            alt="NimbusOps QR Code"
            class="qr-code"
        />

        <h2>Operations Dashboard</h2>

        <button class="btn" onclick="runHealthCheck()">Run Health Check</button>
        <button class="btn" onclick="runPatch()">Run Patch</button>
        <button class="btn" onclick="runBackup()">Run Backup</button>
        <button class="btn" onclick="runHarden()">Run Security Baseline</button>

        <div id="output" class="output-box">Awaiting command...</div>
    </div>

    <script>
        const API_BASE = "https://nimbusops-control-2.onrender.com";

        async function callAPI(endpoint) {
            const output = document.getElementById("output");
            output.textContent = "Running...";

            try {
                const response = await fetch(`${API_BASE}${endpoint}`);
                const data = await response.json();
                output.textContent = JSON.stringify(data, null, 2);
            } catch (err) {
                output.textContent = "Error: " + err;
            }
        }

        function runHealthCheck() {
            callAPI("/api/health-check/run");
        }

        function runPatch() {
            callAPI("/api/patch/run");
        }

        function runBackup() {
            callAPI("/api/backup/run");
        }

        function runHarden() {
            callAPI("/api/harden/run");
        }
    </script>

</body>
</html>
