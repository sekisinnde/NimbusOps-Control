---
- name: Backup Critical System Configurations
  hosts: targets
  become: yes
  gather_facts: no

  vars:
    backup_base_dir: /opt/backups
    backup_timestamp: "{{ lookup('pipe', 'date +%Y%m%d-%H%M%S') }}"
    backup_dir: "{{ backup_base_dir }}/{{ backup_timestamp }}"

  tasks:

    - name: Ensure base backup directory exists on remote
      become: yes
      file:
        path: "{{ backup_base_dir }}"
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Create timestamped backup directory on remote
      become: yes
      file:
        path: "{{ backup_dir }}"
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Verify backup directory exists
      become: yes
      stat:
        path: "{{ backup_dir }}"
      register: backup_dir_check

    - name: Abort if backup directory does not exist
      fail:
        msg: "Backup directory {{ backup_dir }} does not exist"
      when: not backup_dir_check.stat.exists

    - name: Backup SSH configuration
      become: yes
      copy:
        src: /etc/ssh/sshd_config
        dest: "{{ backup_dir }}/sshd_config"
        remote_src: yes

    - name: Backup sudoers file
      become: yes
      copy:
        src: /etc/sudoers
        dest: "{{ backup_dir }}/sudoers"
        remote_src: yes

    - name: Backup passwd file
      become: yes
      copy:
        src: /etc/passwd
        dest: "{{ backup_dir }}/passwd"
        remote_src: yes

    - name: Backup group file
      become: yes
      copy:
        src: /etc/group
        dest: "{{ backup_dir }}/group"
        remote_src: yes

    - name: Create compressed archive of backup directory
      become: yes
      archive:
        path: "{{ backup_dir }}"
        dest: "{{ backup_base_dir }}/config-backup-{{ backup_timestamp }}.tar.gz"
        format: gz

    - name: Show backup location
      debug:
        msg: "Backup created at {{ backup_base_dir }}/config-backup-{{ backup_timestamp }}.tar.gz"

