- name: Backup System Configuration Files
  hosts: localhost
  gather_facts: yes
  become: yes

  vars:
    backup_dir: "/tmp/nimbusops_backup"

  tasks:
    - name: Create backup directory
      file:
        path: "{{ backup_dir }}"
        state: directory
        mode: '0755'

    - name: Backup /etc directory
      command: tar -czf {{ backup_dir }}/etc_backup.tar.gz /etc
      register: etc_backup

    - name: Backup /home directory
      command: tar -czf {{ backup_dir }}/home_backup.tar.gz /home
      register: home_backup

    - name: Display backup results
      debug:
        msg: |
          === BACKUP DIRECTORY ===
          {{ backup_dir }}

          === /etc BACKUP ===
          {{ etc_backup.stdout }}

          === /home BACKUP ===
          {{ home_backup.stdout }}
