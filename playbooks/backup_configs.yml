- name: Backup Critical System Configurations
  hosts: targets
  become: yes
  gather_facts: no

  vars:
    backup_dir: /tmp/nimbusops_backups

  tasks:
    - name: Create backup directory
      file:
        path: "{{ backup_dir }}"
        state: directory
        mode: '0755'

    - name: Backup SSH configuration
      copy:
        src: /etc/ssh/sshd_config
        dest: "{{ backup_dir }}/sshd_config.backup"

    - name: Backup hosts file
      copy:
        src: /etc/hosts
        dest: "{{ backup_dir }}/hosts.backup"

    - name: Backup fstab
      copy:
        src: /etc/fstab
        dest: "{{ backup_dir }}/fstab.backup"

