
---
- name: Security Hardening Baseline
  hosts: all
  become: yes
  gather_facts: yes

  tasks:
    - name: Ensure UFW is installed
      apt:
        name: ufw
        state: present
      ignore_errors: yes

    - name: Enable UFW firewall
      ufw:
        state: enabled
        policy: deny
      ignore_errors: yes

    - name: Allow SSH through firewall
      ufw:
        rule: allow
        name: OpenSSH
      ignore_errors: yes

    - name: Disable root SSH login
      lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^PermitRootLogin'
        line: 'PermitRootLogin no'
      notify: Restart SSH
      ignore_errors: yes

    - name: Disable password authentication
      lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^PasswordAuthentication'
        line: 'PasswordAuthentication no'
      notify: Restart SSH
      ignore_errors: yes

    - name: Ensure fail2ban is installed
      apt:
        name: fail2ban
        state: present
      ignore_errors: yes

    - name: Start and enable fail2ban
      service:
        name: fail2ban
        state: started
        enabled: yes
      ignore_errors: yes

  handlers:
    - name: Restart SSH
      service:
        name: ssh
        state: restarted
      ignore_errors: yes

