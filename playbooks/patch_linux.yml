---
- name: Patch and Reboot System
  hosts: remote
  become: yes

  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes

    - name: Upgrade all packages
      apt:
        upgrade: dist
        autoremove: yes

    - name: Reboot if required
      reboot:
        msg: "Rebooting after patching"
        connect_timeout: 5
        reboot_timeout: 600
